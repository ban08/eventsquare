openapi: 3.0.0

info:
  version: "1.0"
  title: "LBAW MediaLibrary Web API"
  description: "A7 - Web Resources Specification (vertical prototype) for MediaLibrary"

servers:
  - url: http://127.0.0.1:8000
    description: Production server

tags:
  - name: "M01: Authentication and Individual Profile"
  - name: "M02: Works"
  - name: "M03: Reviews and Wishlist"
  - name: "M04: Loans"
  - name: "M05: User Administration and Static pages"

x-permissions:
  PUB: "Public (guest users)"
  USR: "Authenticated users"
  OWN: "Owner of the resource"
  ADM: "Administrators"

paths:
  ############################
  # M01 – Authentication & Profile
  ############################
  /login:
    get:
      operationId: R101
      summary: "R101: Login Form"
      description: "Provide login form. Access: PUB"
      tags: ["M01: Authentication and Individual Profile"]
      x-permissions: PUB
      responses:
        "200":
          description: "OK. Show log-in UI (HTML)."
    post:
      operationId: R102
      summary: "R102: Login Action"
      description: "Process login form submission. Access: PUB"
      tags: ["M01: Authentication and Individual Profile"]
      x-permissions: PUB
      security:
        - sessionCookie: []
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
                password: { type: string }
              required: [email, password]
      responses:
        "302":
          description: "Redirect after processing the login credentials."
          headers:
            Location:
              schema: { type: string }
              examples:
                success: { description: "Authenticated → profile", value: "/users/me" }
                error:   { description: "Failed auth → back to /login", value: "/login" }

  /logout:
    post:
      operationId: R103
      summary: "R103: Logout Action"
      description: "Logout current user. Access: USR, ADM"
      tags: ["M01: Authentication and Individual Profile"]
      x-permissions: [USR, ADM]
      security:
        - sessionCookie: []
        - csrfHeader: []
      responses:
        "302":
          description: "Redirect after logout."
          headers:
            Location:
              schema: { type: string }
              examples:
                afterLogout: { value: "/login" }


  /register:
    get:
      operationId: R104
      summary: "R104: Register Form"
      description: "Provide registration form. Access: PUB"
      tags: ["M01: Authentication and Individual Profile"]
      x-permissions: PUB
      responses:
        "200": { description: "OK. Show sign-up UI (HTML)." }
    post:
      operationId: R105
      summary: "R105: Register Action"
      description: "Process registration form. Access: PUB"
      tags: ["M01: Authentication and Individual Profile"]
      x-permissions: PUB
      security:
        - sessionCookie: []
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                picture: { type: string, format: binary }
              required: [name, email, password]
      responses:
        "302":
          description: "Redirect after registration."
          headers:
            Location:
              schema: { type: string }
              examples:
                success: { value: "/users/me" }
                failure: { value: "/register" }

  /users/me:
    get:
      operationId: R106
      summary: "R106: View own profile"
      description: "Show current user profile page. Access: USR"
      tags: ["M01: Authentication and Individual Profile"]
      x-permissions: USR
      responses:
        "200": { description: "OK. Show profile UI (HTML)." }
        "401": { description: "Unauthorized" }

  /users/{id}:
    get:
      operationId: R107
      summary: "R107: View user public profile"
      description: "Show public profile of a user. Access: PUB"
      tags: ["M01: Authentication and Individual Profile"]
      x-permissions: PUB
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200": { description: "OK. Show public profile UI (HTML)." }
        "404": { description: "User not found" }

  ############################
  # M02 – Works (items)
  ############################
  /works:
    get:
      operationId: R201
      summary: "R201: Works list and search (view)"
      description: "View with filters and pagination. Access: PUB"
      tags: ["M02: Works"]
      x-permissions: PUB
      parameters:
        - $ref: "#/components/parameters/Q"
        - $ref: "#/components/parameters/Page"
      responses:
        "200": { description: "OK. Show works list UI (HTML)." }

  /works/{id}:
    get:
      operationId: R202
      summary: "R202: Work details (view)"
      description: "Show work details page. Access: PUB"
      tags: ["M02: Works"]
      x-permissions: PUB
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200": { description: "OK. Show work page UI (HTML)." }
        "404": { description: "Work not found" }

  /api/works:
    get:
      operationId: R203
      summary: "R203: Search Works (AJAX)"
      description: "Return works as JSON for live search. Access: PUB"
      tags: ["M02: Works"]
      x-permissions: PUB
      parameters:
        - $ref: "#/components/parameters/Q"
        - in: query
          name: type
          schema: { type: string, enum: [BOOK, DVD, MP3, OTHER] }
        - in: query
          name: year
          schema: { type: integer }
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          description: "Search results"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorkSummary" }
              examples:
                sample:
                  value:
                    - id: 1
                      title: "Rihanna - Unapologetic"
                      year: 2012
                      type: "MP3"
                      ownerName: "Joana Lima"
                    - id: 15
                      title: "Mr. Bean"
                      year: 1995
                      type: "DVD"
                      ownerName: "Manuel Teixeira"

  ############################
  # M03 – Reviews & Wishlist
  ############################
  /api/works/{id}/reviews:
    get:
      operationId: R301
      summary: "R301: List reviews for a work (AJAX)"
      description: "Return reviews as JSON. Access: PUB"
      tags: ["M03: Reviews and Wishlist"]
      x-permissions: PUB
      parameters:
        - $ref: "#/components/parameters/PathId"
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Review" }

  /works/{id}/reviews:
    post:
      operationId: R302
      summary: "R302: Create review (action)"
      description: "Submit review for a work. Access: USR"
      tags: ["M03: Reviews and Wishlist"]
      x-permissions: USR
      parameters:
        - $ref: "#/components/parameters/PathId"
      security:
        - sessionCookie: []
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                body: { type: string, maxLength: 1000 }
              required: [rating]
      responses:
        "302":
          description: "Redirect back to work page."
          headers:
            Location:
              schema: { type: string }
              example: "/works/{id}"
        "401": { description: "Unauthorized" }

  /reviews/{rid}:
    delete:
      operationId: R303
      summary: "R303: Delete own review (action)"
      description: "Remove a review you authored. Access: OWN"
      tags: ["M03: Reviews and Wishlist"]
      x-permissions: OWN
      parameters:
        - in: path
          name: rid
          required: true
          schema: { type: integer }
      security:
        - sessionCookie: []
        - csrfHeader: []
      responses:
        "302":
          description: "Redirect back to previous page."
          headers:
            Location:
              schema: { type: string }
              example: "/works/{id}"
        "403": { description: "Forbidden (not owner)" }

  /me/wishlist:
    get:
      operationId: R304
      summary: "R304: View wishlist (view)"
      description: "Show current user's wishlist. Access: USR"
      tags: ["M03: Reviews and Wishlist"]
      x-permissions: USR
      responses:
        "200": { description: "OK. Wishlist UI (HTML)." }
        "401": { description: "Unauthorized" }

  /works/{id}/wishlist:
    post:
      operationId: R305
      summary: "R305: Add to wishlist (action)"
      description: "Add work to user's wishlist. Access: USR"
      tags: ["M03: Reviews and Wishlist"]
      x-permissions: USR
      parameters:
        - $ref: "#/components/parameters/PathId"
      security:
        - sessionCookie: []
        - csrfHeader: []
      responses:
        "302":
          description: "Redirect back to work page."
          headers:
            Location:
              schema: { type: string }
              example: "/works/{id}"
    delete:
      operationId: R306
      summary: "R306: Remove from wishlist (action)"
      description: "Remove work from user's wishlist. Access: USR"
      tags: ["M03: Reviews and Wishlist"]
      x-permissions: USR
      parameters:
        - $ref: "#/components/parameters/PathId"
      security:
        - sessionCookie: []
        - csrfHeader: []
      responses:
        "302":
          description: "Redirect back to work page."
          headers:
            Location:
              schema: { type: string }
              example: "/works/{id}"

  ############################
  # M04 – Loans
  ############################
  /me/loans:
    get:
      operationId: R401
      summary: "R401: View my loans (view)"
      description: "Show current user's loans. Access: USR"
      tags: ["M04: Loans"]
      x-permissions: USR
      responses:
        "200": { description: "OK. Loans UI (HTML)." }

  /works/{id}/loans:
    post:
      operationId: R402
      summary: "R402: Request loan (action)"
      description: "Create a new loan request for a work (cannot loan own items). Access: USR"
      tags: ["M04: Loans"]
      x-permissions: USR
      parameters:
        - $ref: "#/components/parameters/PathId"
      security:
        - sessionCookie: []
        - csrfHeader: []
      requestBody:
        required: false
      responses:
        "302":
          description: "Redirect back to work page."
          headers:
            Location:
              schema: { type: string }
              example: "/works/{id}"
        "409": { description: "Conflict (already loaned)" }

  /loans/{lid}:
    patch:
      operationId: R403
      summary: "R403: Return / close loan (action)"
      description: "Mark a loan as returned. Access: OWN or ADM"
      tags: ["M04: Loans"]
      x-permissions: OWN
      parameters:
        - in: path
          name: lid
          required: true
          schema: { type: integer }
      security:
        - sessionCookie: []
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                status: { type: string, enum: [returned] }
              required: [status]
      responses:
        "302":
          description: "Redirect back to /me/loans."
          headers:
            Location:
              schema: { type: string }
              example: "/me/loans"

  ############################
  # M05 – Admin & Static
  ############################
  /admin:
    get:
      operationId: R501
      summary: "R501: Admin dashboard"
      description: "Admin entry page. Access: ADM"
      tags: ["M05: User Administration and Static pages"]
      x-permissions: ADM
      responses:
        "200": { description: "OK. Admin UI (HTML)." }
        "403": { description: "Forbidden" }

  /admin/users:
    get:
      operationId: R502
      summary: "R502: List/search users (view)"
      description: "Admin users list with filters. Access: ADM"
      tags: ["M05: User Administration and Static pages"]
      x-permissions: ADM
      parameters:
        - $ref: "#/components/parameters/Q"
        - $ref: "#/components/parameters/Page"
      responses:
        "200": { description: "OK. Users table UI (HTML)." }

  /admin/users/{id}:
    get:
      operationId: R503
      summary: "R503: View user (admin)"
      description: "Admin view of a user's profile. Access: ADM"
      tags: ["M05: User Administration and Static pages"]
      x-permissions: ADM
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200": { description: "OK. Admin user UI (HTML)." }
        "404": { description: "Not found" }
    patch:
      operationId: R504
      summary: "R504: Block/Unblock user (action)"
      description: "Toggle user status. Access: ADM"
      tags: ["M05: User Administration and Static pages"]
      x-permissions: ADM
      parameters:
        - $ref: "#/components/parameters/PathId"
      security:
        - sessionCookie: []
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                status: { type: string, enum: [block, unblock] }
              required: [status]
      responses:
        "302":
          description: "Redirect back to admin user page."
          headers:
            Location:
              schema: { type: string }
              example: "/admin/users/{id}"

  /about:
    get:
      operationId: R505
      summary: "R505: Static About page"
      description: "Static content. Access: PUB"
      tags: ["M05: User Administration and Static pages"]
      x-permissions: PUB
      responses:
        "200": { description: "OK. HTML page." }

  /contact:
    get:
      operationId: R506
      summary: "R506: Static Contact page"
      description: "Static content. Access: PUB"
      tags: ["M05: User Administration and Static pages"]
      x-permissions: PUB
      responses:
        "200": { description: "OK. HTML page." }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: laravel_session
      description: "Session cookie set by Laravel after login."
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-TOKEN
      description: "CSRF token for AJAX POST/PUT/PATCH/DELETE."

  parameters:
    PathId:
      in: path
      name: id
      required: true
      schema: { type: integer }
    Q:
      in: query
      name: q
      description: "Free-text search"
      schema: { type: string }
    Page:
      in: query
      name: page
      schema: { type: integer, minimum: 1 }
      description: "Pagination page (default 1)"

  schemas:
    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        avatarUrl: { type: string }
        role: { type: string, enum: [USR, ADM] }

    WorkSummary:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        year: { type: integer }
        type: { type: string, enum: [BOOK, DVD, MP3, OTHER] }
        ownerName: { type: string }

    Work:
      allOf:
        - $ref: "#/components/schemas/WorkSummary"
        - type: object
          properties:
            description: { type: string }
            ownerId: { type: integer }

    Review:
      type: object
      properties:
        id: { type: integer }
        workId: { type: integer }
        author: { $ref: "#/components/schemas/User" }
        rating: { type: integer, minimum: 1, maximum: 5 }
        body: { type: string }
        createdAt: { type: string, format: date-time }

    Loan:
      type: object
      properties:
        id: { type: integer }
        workId: { type: integer }
        borrower: { $ref: "#/components/schemas/User" }
        status: { type: string, enum: [pending, active, returned] }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date, nullable: true }

    Error:
      type: object
      properties:
        message: { type: string }

security:
  - sessionCookie: []
