openapi: 3.0.0

info:
  title: "EventSquare Web API"
  description: |
    Web Resources Specification for EventSquare.

    This document describes the *web endpoints* used by the vertical prototype:
    - View endpoints (GET) return HTML pages (forms, lists, details).
    - Action endpoints (POST/DELETE) process forms and then redirect.
    - Some endpoints may later get AJAX/JSON variants.
  version: 1.0.0

servers:
  - url: http://localhost:8000/api
    description: Development server
  - url: https://lbaw.fe.up.pt
    description: Production host

x-permissions:
  PUB: "Public (guest users)"
  USR: "Authenticated users"
  OWN: "Owner of the resource (e.g., comment author)"
  ORG: "Organizer of the event (resource owner for Event)"
  ADM: "Administrators"

tags:
  - name: "M01: Authentication & Profile"
    description: "Login, logout, registration, and viewing the current user's profile."
  - name: "M02: Events"
    description: "Browse, search, view, create, and edit events."
  - name: "M03: Participation (Applications & Invitations)"
    description: "Apply to events, invite users, respond to invitations, and view my participations."
  - name: "M04: Interactions (Comments & Polls)"
    description: "List and create comments, delete own comments, and vote in polls."
  - name: "M05: Admin & Static"
    description: "Admin dashboard and static informational pages."

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: laravel_session
      description: "Session cookie set by Laravel after login."
  parameters:
    EventId:
      in: path
      name: eventId
      required: true
      schema:
        type: integer
  schemas:
    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
    EventCreateForm:
      type: object
      properties:
        title:
          type: string
          description: "Event title"
        description:
          type: string
          description: "Event description"
        start_at:
          type: string
          format: date-time
          description: "Start date and time"
        end_at:
          type: string
          format: date-time
          description: "End date and time (optional)"
        venue:
          type: string
          description: "Where the event happens"
        capacity:
          type: integer
          minimum: 1
          description: "Maximum number of participants"
      required: [title, start_at, venue, capacity]
    EventUpdateForm:
      type: object
      properties:
        title: { type: string }
        description: { type: string }
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
        venue: { type: string }
        capacity:
          type: integer
          minimum: 1
    Error:
      type: object
      properties:
        message:
          type: string

paths:
  ####################################################################
  # M01 – Authentication & Profile (VT01 only: REGISTER)
  ####################################################################

  /register:
    # VIEW endpoint: show registration form (HTML)
    get:
      operationId: R104
      summary: "R104: Register Form"
      description: |
        Show registration form. Access: PUB.
      tags: ["M01: Authentication & Profile"]
      x-permissions: [PUB]
      security: []
      responses:
        "200":
          description: "OK. Returns HTML with the sign-up form."
        "400":
          description: "Bad request."

    # ACTION endpoint: process registration and redirect
    post:
      operationId: R105
      summary: "R105: Register Action"
      description: |
        Process registration form and create a new user account.
        On success, usually logs in the user and redirects to another page.
      tags: ["M01: Authentication & Profile"]
      x-permissions: [PUB]
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                password_confirmation: { type: string }
                picture: { type: string, format: binary }
              required: [name, email, password, password_confirmation]
      responses:
        "302":
          description: "Redirect after registration."
          headers:
            Location:
              schema:
                type: string
              examples:
                success:
                  value: "/login"      # or some dashboard page if you prefer
                failure:
                  value: "/register"
        "422":
          description: "Validation error."
